services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: billing-backend:prod
    env_file:
      - .env.prod
    environment:
      PORT: 8000
      APP_ENV: production
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000} --workers $${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips $${FORWARDED_ALLOW_IPS:-*}"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
