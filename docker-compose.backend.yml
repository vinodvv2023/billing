services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: billing-backend:prod
    env_file:
      - .env.prod
    environment:
      PORT: 8000
      APP_ENV: production
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
